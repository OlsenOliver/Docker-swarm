---
services:
  tinymediamanager:
    image: tinymediamanager/tinymediamanager:5.2.4
  environment:
      - USER_ID=1000
      - GROUP_ID=100
      - ALLOW_DIRECT_VNC=true
      - LC_ALL=en_US.UTF-8 # force UTF8
      - LANG=en_US.UTF-8   # force UTF8
      - PASSWORD=PleaseLetMeIn
    volumes:
      - ./data:/data
      - movies:/media/movies
      - tv-show:/media/tv_shows
    ports:
      - 5900:5900 # VNC port
      - 4000:4000 # Webinterface
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.hostname == sw-wrk01]

volumes:
  movies:
    driver_opts:
      type: "nfs"
      o: addr=10.0.0.80,nolock,soft,rw
      device: ":/storage/Media/HD-Film"
  tv-show:
    driver_opts:
      type: "nfs"
      o: "addr=10.0.0.80,nolock,soft,rw"
      device: ":/storage/Media/TV-show"
